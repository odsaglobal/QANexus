services:
  postgres:
    image: postgres:16-alpine
    container_name: atip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: atip
      POSTGRES_USER: atip
      POSTGRES_PASSWORD: atip
    ports:
      - "5433:5432"
    volumes:
      - atip-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atip -d atip"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: atip-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - atip-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  atip-postgres-data:
  atip-redis-data:
